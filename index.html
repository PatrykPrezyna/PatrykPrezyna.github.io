<!-- If content.js has a typing mistake, say so on the page instead of showing nothing. -->
<script>
  window.addEventListener("error", function (event) {
    if (window.SITE || !/content\.js/.test(event.filename || "")) return;
    var box = document.createElement("div");
    box.style.cssText = "position:fixed;inset:0 0 auto 0;z-index:9999;padding:1.2rem 1.5rem;background:#b3261e;color:#fff;font:16px/1.5 sans-serif";
    box.textContent = "content.js has a mistake near line " + event.lineno + ", so the page cannot be shown. " +
      "Usually a comma or a quote is missing on that line or the one before it. (" + event.message + ")";
    document.body.appendChild(box);
  });
</script>
